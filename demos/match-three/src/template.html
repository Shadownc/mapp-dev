<main class="candy">
  <p class="candy__connection" id="connection" role="status" data-text="playerLoading"></p>
  <header class="candy__header">
    <div>
      <p class="candy__eyebrow">MAPP ARCADE</p>
      <h1 data-text="title"></h1>
      <p data-text="tagline"></p>
    </div>
    <div class="candy__scores">
      <div><span data-text="score"></span><strong id="score">0</strong></div>
      <div><span data-text="best"></span><strong id="best">0</strong></div>
    </div>
  </header>
  <div class="candy__player">
    <div><strong id="player" data-text="playerLoading"></strong><span data-text="identity"></span></div>
    <button id="refresh" type="button" data-text="refresh"></button>
  </div>
  <details class="candy__leaderboard" id="leaderboard" hidden>
    <summary data-text="rankTitle"></summary>
    <p data-text="rankRules"></p>
    <p id="rank-status" role="status"></p>
    <div class="candy__rank-controls">
      <button id="rank-refresh" type="button" data-text="rankRefresh"></button>
      <label><span data-text="rankChoose"></span><select id="rank-level"></select></label>
      <button id="rank-start" type="button" data-text="rankStart"></button>
    </div>
    <p data-text="rankStartHint"></p>
    <div class="candy__rank-controls">
      <button id="rank-retry" type="button" data-text="rankSubmit" hidden></button>
      <button id="rank-discard" type="button" data-text="rankDiscard" hidden></button>
    </div>
    <p id="rank-mine"></p>
    <div id="rank-list"></div>
  </details>
  <p class="candy__game-mode" id="game-mode" hidden></p>
  <nav class="candy__levels" id="levels"></nav>
  <div class="candy__level-heading"><strong id="level-title"></strong><span data-text="levelInstruction"></span></div>
  <div class="candy__targets" id="targets" role="group"></div>
  <div class="candy__status"><span id="moves"></span><span id="combo"></span></div>
  <div class="candy__goal"><div class="candy__progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0"><span></span></div><span id="target-label"></span></div>
  <div class="candy__play">
    <div class="candy__board" id="board" tabindex="0" role="grid"></div>
    <div class="candy__overlay" id="overlay" hidden>
      <h2 id="overlay-title"></h2><p id="overlay-copy"></p>
      <button id="again" type="button" data-text="again"></button>
      <button id="continue" type="button" data-text="nextLevel"></button>
    </div>
    <div class="candy__effects" id="effects" aria-hidden="true"></div>
  </div>
  <div class="candy__controls">
    <span data-text="help"></span>
    <button id="pause" type="button" data-text="pause"></button>
    <button id="reset" type="button" data-text="reset"></button>
  </div>
  <div class="candy__specials">
    <p data-text="specialHelp"></p>
    <div class="candy__legend">
      <span><b aria-hidden="true">✹</b><span data-text="special_area"></span></span>
      <span><b aria-hidden="true">↔</b><span data-text="special_row"></span></span>
      <span><b aria-hidden="true">↕</b><span data-text="special_column"></span></span>
    </div>
  </div>
  <p class="candy__notice" id="notice" role="status" aria-live="polite"></p>
</main>
